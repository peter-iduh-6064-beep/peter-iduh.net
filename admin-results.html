<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Pharm. Peter Yakubu Iduh</title>

<style>
body{
font-family:Arial,sans-serif;
background:#006b3f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
background:white;
padding:30px;
border-radius:12px;
width:320px;
text-align:center;
}
h2{color:#006b3f;}
input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}
button{
width:100%;
padding:12px;
background:#006b3f;
color:white;
border:none;
border-radius:6px;
font-size:16px;
font-weight:bold;
}
#adminPage{display:none;}
</style>
</head>

<body>

<div id="loginPage" class="box">
<h2>Admin Login</h2>

<input id="username" type="text" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="loginAdmin()">LOGIN</button>

<p id="loginMessage" style="color:red;"></p>
</div>

<div id="adminPage" class="box">
<h2>Welcome Admin</h2>

<p>Login Successful.</p>

<p><b>Pharm. Peter Yakubu Iduh Admin Dashboard</b></p>

<button onclick="logoutAdmin()">Logout</button>
</div>

<script>
const ADMIN_USERNAME="iduh4rep2027";
const ADMIN_PASSWORD="iduh4rep2027";

if(localStorage.getItem("adminLoggedIn")=="true"){
document.getElementById("loginPage").style.display="none";
document.getElementById("adminPage").style.display="block";
}

function loginAdmin(){
let user=document.getElementById("username").value.trim();
let pass=document.getElementById("password").value.trim();

if(user===ADMIN_USERNAME && pass===ADMIN_PASSWORD){
localStorage.setItem("adminLoggedIn","true");
document.getElementById("loginPage").style.display="none";
document.getElementById("adminPage").style.display="block";
}else{
document.getElementById("loginMessage").innerHTML="Wrong Username or Password";
}
}

function logoutAdmin(){
localStorage.removeItem("adminLoggedIn");
location.reload();
}
</script>

</body>
</html>
